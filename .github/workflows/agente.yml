name: Agente de Vagas
on:
  schedule:
    - cron: "0 11 * * 2,4"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execucao (disparo manual apenas; agendamento cron usa confirm por enquanto)"
        type: choice
        default: "dry-run"
        options: [dry-run, confirm, auto]

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get install -y pandoc texlive-xetex fonts-dejavu

      - name: Restaurar credenciais Google (secrets)
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_B64 }}" | base64 -d > credentials.json
          echo "${{ secrets.GOOGLE_TOKEN_B64 }}" | base64 -d > token.json

      - name: Rodar agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          # TEMPORARIO: agendamento cron usa 'confirm' (nao 'auto') ate a
          # detecao de campos obrigatorios/verificacao de sucesso em
          # candidatar.py serem validadas com casos reais. Reverter para
          # 'auto' apos validar.
          MODO: ${{ github.event.inputs.modo || 'confirm' }}
        run: |
          case "$MODO" in
            auto) python main.py --auto ;;
            confirm) python main.py --confirm ;;
            *) python main.py ;;
          esac

      - name: Guardar pacotes gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-${{ github.run_id }}
          path: output/
          retention-days: 14
